[project]
name = "portfolio-analyzer"
version = "0.1.0"
description = "Multi-broker portfolio analyzer: ETF look-through, overlap, fees, concentration, asset classes"
requires-python = ">=3.10"
dependencies = [
    "ibflex>=0.15",
    "yfinance>=0.2.30",
    "rich>=13.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "supabase>=2.0",
    "cryptography>=41.0",
]

[project.scripts]
portfolio-analyzer = "portfolio_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
